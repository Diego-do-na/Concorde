# tasks.yaml — the single source of truth for Cauce's task board.
# NEVER edit this file by hand outside of scripts/*.py.
#
# THIS IS A TEMPORARY SMOKE-TEST BOARD, not the real CONCORDE task list.
# Purpose: verify that claim_task.py / finish_task.py / check_merge.py work
# end-to-end with 3 agents claiming and finishing tasks in parallel, with
# zero scope collisions, before the real board (generated by Fable 5.1)
# replaces this file.
#
# The real 23-task CONCORDE board (T001-T023 from spec §13.2) is saved at
# docs/tasks.concorde-v1-seed.yaml — do not delete it, it's a reference
# fallback in case the Fable-generated board needs to be cross-checked.
#
# Every task here just writes a small file under smoke-test/ so it's fast,
# harmless, and trivially verifiable ("did the file appear on the right
# branch with the right content"). Delete smoke-test/ once this test is done.
