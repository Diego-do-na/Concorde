  title: 'Smoke test: agent A writes its file'
  description: 'Create the file smoke-test/agent-a.txt containing the single
    line "agent-a was here". This is a Cauce smoke test, not real CONCORDE
    work — just prove you can claim, edit inside your scope, and finish.

    '
