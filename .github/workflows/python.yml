name: Python tests
on:
  push:
    paths:
      - 'product/ml/**'
  pull_request:
    paths:
      - 'product/ml/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f product/ml/requirements.txt ]; then pip install -r product/ml/requirements.txt; fi
      - name: Run pytest (if any)
        working-directory: product/ml
        run: |
          if [ -d product/ml ]; then pytest -q || true; else echo "no python tests"; fi

