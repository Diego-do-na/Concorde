- id: T045
  title: '[Paul] Live local semantic vote in /detect: probe detector + whisper-rs
    on one caller turn, hard timeout, bounded fusion, explicit degradation (ADR-008,
    NFR-001, NFR-010)'
  description: '(a) BUILD — product/api/src/semantic/: (1) `ProbeDetector` loading
    product/artifacts/probe_templates.json (T043): 32-band log-mel at 8 kHz + subsequence
    DTW in Rust (f32, band-limited), run over the agent turns after VAD; returns the
    probe turn or None (~2M DP cells per call, expected a few ms — measure and log).
    (2) `LocalAsr` via whisper-rs 0.16 (cmake + libclang on the build host, installed
    by T003): ONE `WhisperContext` created at boot from CONCORDE_WHISPER_MODEL_PATH
    (model approved by T057), a `WhisperState` per request, threads = CONCORDE_WHISPER_THREADS,
    language es, no timestamps, audio_ctx chosen from the segment length (<= 10 s
    → 512, <= 15 s → 768, else 1500), input = the first caller turn after the probe,
    8→16 kHz resampled, capped at 15 s. A tokio Semaphore of CONCORDE_ASR_MAX_CONCURRENT
    permits; if no permit is free the probe is SKIPPED immediately (reason=busy),
    never queued — ASR runs on spawn_blocking so the async runtime never stalls. (3)
    `rules.rs`: answer_type + invention_score ported line by line from product/ml/semantic/rules.py.
    (4) Fusion from product/artifacts/semantic_fusion.json (w, max_delta_p) at boot:
    logit(p_final) = logit(p_behavioral) + w·(invention_score − 0.5), clamped; verdict
    and confidence (§8.4) from p_final. Flow in pipeline.rs: decode → VAD → probe
    detector → SPAWN ASR → features → inference concurrently → wait for ASR only until
    CONCORDE_SEMANTIC_TIMEOUT_MS (default 1500 from ASR start, T057 may raise it to
    2000); on timeout the blocking task is abandoned and its result discarded. When
    absent for any reason (no probe, busy, timeout, error, disabled): p_final = p_behavioral
    exactly — deterministic behavioral-only verdict (NFR-010) — with semantic_available=false,
