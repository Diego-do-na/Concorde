<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cauce — New Task</title>
<style>
  /* ---- shared Cauce design tokens (kept identical in boss-dashboard) ---- */
  :root {
    --bg: #0b0d10;
    --surface: #14171b;
    --surface-2: #1b1f24;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #e8eaed;
    --text-dim: #9aa1ab;
    --text-faint: #666d78;
    --accent: #4d8dff;
    --accent-dim: rgba(77,141,255,0.14);
    --accent-strong: #6ea1ff;
    --radius: 10px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .page { max-width: 620px; margin: 0 auto; padding: 48px 24px 80px; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header .subtitle { color: var(--text-faint); font-size: 12.5px; }

  form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label { display:block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }

  input[type=text], textarea, select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 9px 11px;
    transition: border-color 150ms ease;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 90px; }
  select[multiple] { min-height: 110px; }

  .scope-row { display:flex; gap: 8px; margin-bottom: 8px; }
  .scope-row input { flex: 1; }
  .scope-row button, .add-scope { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 7px; cursor: pointer; font-size: 13px; padding: 8px 10px; }
  .scope-row button:hover, .add-scope:hover { border-color: var(--border-strong); color: var(--text); }
  .add-scope { font-size: 12.5px; }

  .actions { margin-top: 22px; display:flex; align-items:center; gap: 12px; }
  button.primary {
    background: var(--accent);
    color: #05070a;
    border: none;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13.5px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 150ms ease, transform 100ms ease;
  }
  button.primary:hover { background: var(--accent-strong); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; cursor: default; }

  .banner { border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 18px; display:none; }
  .banner.show { display:block; }
  .banner.success { background: var(--accent-dim); border: 1px solid var(--accent-dim); color: var(--accent-strong); }
  .banner.error { background: rgba(255,90,90,0.08); border: 1px solid rgba(255,90,90,0.25); color: #ff9c9c; }
  .banner code { font-family: var(--font-mono); }

  @keyframes cauce-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .enter { animation: cauce-enter 220ms cubic-bezier(0.16,1,0.3,1); }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Cauce</h1>
      <div class="subtitle">request a new task · writes straight to tasks.yaml</div>
    </header>

    <div class="banner" id="banner"></div>

    <form id="task-form">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" required maxlength="120" placeholder="Add pagination to /tasks">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" required placeholder="Full prompt/spec for whoever picks this up..."></textarea>
      </div>

      <div class="field">
        <label>Scope</label>
        <div id="scope-rows"></div>
        <button type="button" class="add-scope" id="add-scope">+ add path</button>
        <div class="hint">Repo-relative paths this task will touch — used to detect conflicts with other in-flight tasks.</div>
      </div>

      <div class="field">
        <label for="depends-on">Depends on</label>
        <select id="depends-on" multiple></select>
        <div class="hint">Cmd/Ctrl-click to select multiple. Only tasks already in tasks.yaml appear here.</div>
      </div>

      <div class="field">
        <label for="suggested-model">Suggested model</label>
        <select id="suggested-model">
          <option value="claude-sonnet">claude-sonnet</option>
          <option value="claude-opus">claude-opus</option>
          <option value="cursor">cursor</option>
        </select>
        <div class="hint">A hint only — never enforced.</div>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="submit-btn">Create task</button>
      </div>
    </form>
  </div>

<script>
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function showBanner(kind, html) {
    const el = document.getElementById("banner");
    el.className = `banner ${kind} show enter`;
    el.innerHTML = html;
  }

  function addScopeRow(value = "") {
    const rows = document.getElementById("scope-rows");
    const row = document.createElement("div");
    row.className = "scope-row";
    row.innerHTML = `<input type="text" class="scope-input" placeholder="src/api/health.py" value="${esc(value)}">
                      <button type="button" title="remove">&times;</button>`;
    row.querySelector("button").addEventListener("click", () => {
      if (document.querySelectorAll(".scope-input").length > 1) row.remove();
    });
    rows.appendChild(row);
  }

  document.getElementById("add-scope").addEventListener("click", () => addScopeRow());
  addScopeRow();

  async function loadDependsOnOptions() {
    const select = document.getElementById("depends-on");
    try {
      const res = await fetch("/api/tasks");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "could not load tasks");
      select.innerHTML = data.tasks.map(t =>
        `<option value="${esc(t.id)}">${esc(t.id)} — ${esc(t.title)} (${esc(t.status)})</option>`
      ).join("");
    } catch (err) {
      select.innerHTML = `<option disabled>could not load existing tasks</option>`;
    }
  }
  loadDependsOnOptions();

  document.getElementById("task-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Creating…";

    const scope = Array.from(document.querySelectorAll(".scope-input"))
      .map(i => i.value.trim()).filter(Boolean);
    const dependsOn = Array.from(document.getElementById("depends-on").selectedOptions).map(o => o.value);

    const payload = {
      title: document.getElementById("title").value.trim(),
      description: document.getElementById("description").value.trim(),
      scope,
      depends_on: dependsOn,
      suggested_model: document.getElementById("suggested-model").value,
    };

    try {
      const res = await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "request failed");

      showBanner("success", `Created task <code>${esc(data.id)}</code>.`);
      document.getElementById("task-form").reset();
      document.getElementById("scope-rows").innerHTML = "";
      addScopeRow();
      loadDependsOnOptions();
    } catch (err) {
      showBanner("error", `Could not create task: ${esc(err.message)}`);
    } finally {
      btn.disabled = false;
      btn.textContent = "Create task";
    }
  });
</script>
</body>
</html>
