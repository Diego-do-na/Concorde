[package]
name = "concorde-api"
version = "0.1.0"
edition = "2021"
description = "CONCORDE API service (binary name: concorde)"

[[bin]]
name = "concorde"
path = "src/main.rs"
[[bin]]
name = "vad-dump"
path = "src/bin/vad_dump.rs"

[dependencies]
axum = "0.6"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.4", features = ["trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.21"
bytes = "1.4"
ort = "2.0.0-rc.13"
ndarray = "0.15"
multer = "3.1"
futures-core = "0.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
