# tasks.yaml — the single source of truth for Cauce's task board.
# NEVER edit this file by hand outside of scripts/*.py.
#
# Seeded from CONCORDE spec v1.0 §13.2 (docs/CONCORDE_Especificacion_Tecnica_v1.0.pdf).
# `owner` here is the RACI-designated person from §13.1/§13.2 (who *should*
# claim this task) — claim_task.py will overwrite it with whoever actually
# runs `--owner <name>` when the task is claimed; that's expected, not a bug.
# `status` starts at "todo" for all 23 tasks: nobody has claimed anything yet.
#
# Known scope notes (not conflicts, by construction — see AGENTS.md):
#   - T001 and T023 both include README.md, but T023 depends transitively on
#     T001 (T023 -> T022 -> T014 -> T010 -> T007 -> T006 -> T001), so T001 is
#     always status=done long before T023 becomes eligible.
#   - T003 (deploy/) and T020 (deploy/sql/) overlap by prefix, but T020
#     depends on T015 (itself far downstream of T001), so T003 — a small F0
#     task — is expected to be done well before T020 is claimable.
tasks:
- id: T001
  title: Repo skeleton, workspace, CI build, README stub
  description: 'Create the Cargo workspace layout, GitHub Actions CI build, and
    a README.md stub for later expansion by T023. No business logic yet — this
    just gives later tasks something to build on.

    '
  scope:
  - Cargo.toml
  - .github/
  - README.md
  depends_on: []
  suggested_model: cursor
  status: todo
  owner: Paul
  branch: null
  claimed_at: null
  done_at: null
- id: T002
  title: 'EDA: class balance, overlap density, duration/label correlation, manifest hash'
  description: 'Run the mandatory EDA gates from spec §10.1: confirm exact class
    balance per split (apply class_weight and report AUC/EER if imbalance exceeds
    60/40); measure overlap/interruption event density per call (gate: if <40%
    of calls have an overlap event, flag the F-07..F-13 family as weakened per
    R-04); verify call duration does not correlate with the label (drop duration
    as a feature and document it if it does); compute and record the dataset
    manifest hash for NFR-009 traceability.

    '
  scope:
  - ml/eda/
  depends_on: []
  suggested_model: claude-sonnet
  status: todo
  owner: Diego
  branch: null
  claimed_at: null
  done_at: null
