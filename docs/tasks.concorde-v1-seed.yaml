    regularized per ADR-002) using speaker-grouped cross-validation inside
    train only (ADR-012 — val never participates in selection). Calibrate via
    Platt/isotonic scaling on val. Report ROC-AUC (target ≥0.90), EER, Brier
    score (target ≤0.12), reliability curve, confusion matrix, and error
    breakdown by call duration. Apply the anti-self-deception rule from §10.2
    if val AUC comes back suspiciously high.

    '
